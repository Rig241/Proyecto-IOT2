name: iot-local

services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    ports:
      - "${MQTT_BIND_ADDRESS:-0.0.0.0}:${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_auth:/mosquitto/auth:ro
      - mqtt_data:/mosquitto/data
    logging: &logs
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  puente:
    build: ./bridge
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_started
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_USER: dashboard
      MQTT_PASSWORD_B64: ${MQTT_PASSWORD_B64:-}
      MQTT_TOPIC: iot/monitoreo/mediciones
      STALE_SECONDS: ${STALE_SECONDS:-10}
      PORT: "8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging: *logs

  web:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    depends_on:
      puente:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8080}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    logging: *logs

  # Solo se ejecuta mediante scripts/configurar.py, nunca al arrancar el sistema.
  credenciales:
    image: eclipse-mosquitto:2.1.2-alpine
    profiles: [herramientas]
    user: "0:0"
    network_mode: none
    entrypoint: ["sh", "/init-auth.sh"]
    volumes:
      - mqtt_auth:/auth
      - ./scripts/init-auth.sh:/init-auth.sh:ro
      - ./mosquitto/config/acl:/acl-template:ro

volumes:
  mqtt_auth:
  mqtt_data:
