<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Raspberry Pi - Monitoreo Eléctrico</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <header>
    <h1>⚡ Dashboard Monitoreo Eléctrico</h1>
    <div class="status-container">
      <div class="status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Desconectado</span>
      </div>
      <div class="status">
        <span id="lastUpdate">--:--:--</span>
      </div>
    </div>
  </header>

  <!-- MÉTRICAS -->
  <section class="metrics-grid">
    <div class="metric-card voltaje">
      <div class="metric-label">Voltaje</div>
      <div class="metric-value">
        <span id="valVoltaje">0.00</span><span class="metric-unit">V</span>
      </div>
    </div>
    <div class="metric-card corriente">
      <div class="metric-label">Corriente</div>
      <div class="metric-value">
        <span id="valCorriente">0.00</span><span class="metric-unit">A</span>
      </div>
    </div>
    <div class="metric-card resistencia">
      <div class="metric-label">Resistencia</div>
      <div class="metric-value">
        <span id="valResistencia">0.00</span><span class="metric-unit">Ω</span>
      </div>
    </div>
    <div class="metric-card fase">
      <div class="metric-label">Fase</div>
      <div class="metric-value">
        <span id="valFase">0.00</span><span class="metric-unit">°</span>
      </div>
    </div>
  </section>

  <!-- GRÁFICA PRINCIPAL -->
  <section class="main-chart-container">
    <div class="chart-title">📊 Señales en Tiempo Real</div>
    <canvas id="mainChart"></canvas>
  </section>

  <!-- GRÁFICAS INDIVIDUALES -->
  <section class="charts-grid">
    <div class="chart-card"><canvas id="chartVoltaje"></canvas></div>
    <div class="chart-card"><canvas id="chartCorriente"></canvas></div>
    <div class="chart-card"><canvas id="chartResistencia"></canvas></div>
    <div class="chart-card"><canvas id="chartFase"></canvas></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
